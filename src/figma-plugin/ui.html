<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      color: #1F2937;
      background: #FAFAFA;
    }
    h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .description {
      font-size: 12px;
      color: #6B7280;
      margin-bottom: 16px;
    }
    .upload-area {
      border: 2px dashed #D1D5DB;
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 12px;
    }
    .upload-area:hover {
      border-color: #6366F1;
      background: #F5F3FF;
    }
    .upload-area.has-file {
      border-color: #6366F1;
      background: #EEF2FF;
    }
    .upload-area p {
      font-size: 13px;
      color: #6B7280;
    }
    .upload-area .filename {
      font-size: 14px;
      font-weight: 600;
      color: #6366F1;
      margin-top: 4px;
    }
    .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    input[type="file"] { display: none; }
    .buttons {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #6366F1;
      color: white;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }
    .btn-secondary {
      background: #E5E7EB;
      color: #374151;
    }
    .btn-secondary:hover:not(:disabled) { background: #D1D5DB; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      min-height: 20px;
    }
    .status.success { color: #059669; }
    .status.error { color: #DC2626; }
    .status.info { color: #6366F1; }
  </style>
</head>
<body>
  <h2>상세페이지 임포터</h2>
  <p class="description">AI 생성 도구에서 내보낸 Figma JSON 파일을 임포트합니다.</p>

  <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📄</div>
    <p id="uploadText">JSON 파일을 선택하거나 드래그하세요</p>
    <p class="filename" id="fileName" style="display:none"></p>
  </div>

  <input type="file" id="fileInput" accept=".json">

  <div class="buttons">
    <button class="btn-secondary" id="cancelBtn">취소</button>
    <button class="btn-primary" id="importBtn" disabled>임포트</button>
  </div>

  <p class="status" id="status"></p>

  <script>
    let jsonData = null;

    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const uploadText = document.getElementById('uploadText');
    const fileNameEl = document.getElementById('fileName');
    const importBtn = document.getElementById('importBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const statusEl = document.getElementById('status');

    fileInput.addEventListener('change', handleFile);

    // Drag & Drop
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('has-file');
    });
    uploadArea.addEventListener('dragleave', () => {
      if (!jsonData) uploadArea.classList.remove('has-file');
    });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) processFile(file);
    });

    function handleFile(e) {
      const file = e.target.files[0];
      if (file) processFile(file);
    }

    function processFile(file) {
      if (!file.name.endsWith('.json')) {
        setStatus('JSON 파일만 업로드할 수 있습니다.', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          jsonData = JSON.parse(e.target.result);

          if (!jsonData.root || !jsonData.version) {
            throw new Error('유효하지 않은 형식');
          }

          uploadArea.classList.add('has-file');
          uploadText.style.display = 'none';
          fileNameEl.textContent = file.name;
          fileNameEl.style.display = 'block';
          importBtn.disabled = false;

          setStatus(`"${jsonData.name}" 파일 준비 완료`, 'info');
        } catch (err) {
          setStatus('유효하지 않은 JSON 파일입니다.', 'error');
          jsonData = null;
          importBtn.disabled = true;
        }
      };
      reader.readAsText(file);
    }

    importBtn.addEventListener('click', () => {
      if (!jsonData) return;
      importBtn.disabled = true;
      setStatus('임포트 중...', 'info');
      parent.postMessage({ pluginMessage: { type: 'import', data: jsonData } }, '*');
    });

    cancelBtn.addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    });

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (type || '');
    }

    // Figma 메시지 수신
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'status') {
        setStatus(msg.message, 'success');
        importBtn.disabled = false;
      }
      if (msg.type === 'error') {
        setStatus(msg.message, 'error');
        importBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
